spring:
  application:
    name: data-label
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:datalabel}
    username: ${DB_USER:datalabel}
    # No default: the password comes from the environment (a Kubernetes Secret
    # when deployed, the gitignored .env for local dev; see docs/RUN.md).
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        name: data-label-mcp
        version: 0.1.0
        type: SYNC

server:
  port: 8080
  # The site proxy (and the frontend nginx in front of us) send
  # X-Forwarded-Host (with any explicit port) and X-Forwarded-Proto=https, so
  # {baseUrl} in the OIDC redirect URI is the public https name.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax
        http-only: true

datalabel:
  # Email (README, "Email"): invites to a job, and a notice when a job is
  # finished. Off unless a host is set. Every value can come from the
  # environment (LABELHIVE_MAIL_HOST, ...). A password, if the server wants
  # one, is read from password-file for each send, never from configuration.
  mail:
    host: ${LABELHIVE_MAIL_HOST:}
    port: ${LABELHIVE_MAIL_PORT:0}
    tls: ${LABELHIVE_MAIL_TLS:starttls}
    username: ${LABELHIVE_MAIL_USERNAME:}
    from: ${LABELHIVE_MAIL_FROM:}
    from-name: ${LABELHIVE_MAIL_FROM_NAME:LabelHive}
    reply-to: ${LABELHIVE_MAIL_REPLY_TO:}
    password-file: ${LABELHIVE_MAIL_PASSWORD_FILE:/var/run/labelhive/smtp/password}
    public-url: ${LABELHIVE_PUBLIC_URL:}
    site-name: ${LABELHIVE_SITE_NAME:}
    notify-to: ${LABELHIVE_MAIL_NOTIFY_TO:}
  # Sign-in is OpenID Connect against the site's cloud-stack login service
  # (registrationId `cloudstack`). Every profile except `debug` requires
  # OIDC_ISSUER and fails to start without it. See docs/RUN.md.
  oidc:
    issuer: ${OIDC_ISSUER:}
    # Base URL for server-to-server calls (token, JWKS); defaults to the issuer.
    backchannel-url: ${OIDC_BACKCHANNEL_URL:}
    client-id: ${OIDC_CLIENT_ID:labelhive}
    client-secret: ${OIDC_CLIENT_SECRET:}
  demo:
    seed-on-startup: false

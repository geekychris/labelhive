# Local Postgres for development. Credentials come from .env (gitignored):
#   cp .env.example .env   # then set DB_PASSWORD
services:
  postgres:
    image: postgres:16-alpine
    container_name: data-label-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-datalabel}
      POSTGRES_USER: ${DB_USER:-datalabel}
      # Required, from .env (compose stops with an error when it is unset).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    ports:
      # Map to 5433 on the host to avoid clashing with a local Postgres install.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - data-label-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  data-label-pg:

# The whole app is one port: this nginx serves the SPA and passes the backend's
# routes (REST, MCP, OIDC sign-in/out, health) to the `backend` service.
#
# Behind the site's https proxy the browser is at https://labelhive.<zone>/
# (at Belmont's LAN path also :8443). The proxy sends X-Forwarded-Host (with any
# explicit port) and X-Forwarded-Proto; they are passed on unchanged so the
# backend builds the OIDC redirect URI from the public name. Without a proxy in
# front, the request's own Host and scheme are sent instead.
map $http_x_forwarded_host $lh_forwarded_host {
  default $http_x_forwarded_host;
  ""      $http_host;
}
map $http_x_forwarded_proto $lh_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Shared by every backend location below (a location that sets any
  # proxy_set_header of its own would lose all of these; none does).
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $lh_forwarded_host;
  proxy_set_header X-Forwarded-Proto $lh_forwarded_proto;
  proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
  # Only the backend's local `debug` profile ever read this; never pass it on.
  proxy_set_header X-User-Id "";
  # Sign-in redirects carry large cookies / headers.
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;

  # Vite emits hashed bundles under /assets/* — content-addressed → cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry document — the next deploy ships a new bundle hash.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires off;
  }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    expires off;
    try_files $uri $uri/ /index.html;
  }

  # REST API.
  location /api/ {
    proxy_pass http://backend:8080;
  }

  # OpenID Connect: start of sign-in, the provider's callback, sign-out.
  location /oauth2/ {
    proxy_pass http://backend:8080;
  }
  location /login/oauth2/ {
    proxy_pass http://backend:8080;
  }
  location = /logout {
    proxy_pass http://backend:8080;
  }

  # Probes.
  location = /actuator/health {
    proxy_pass http://backend:8080;
  }
  location /actuator/health/ {
    proxy_pass http://backend:8080;
  }

  # MCP (Spring AI, SSE transport): /sse for the event stream, /mcp/message for calls.
  location = /sse {
    proxy_pass http://backend:8080;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }
  location /mcp {
    proxy_pass http://backend:8080;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
  }
}

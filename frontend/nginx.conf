server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits hashed bundles under /assets/* — content-addressed → cache forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Never cache the entry document — the next deploy ships a new bundle hash.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    expires off;
  }

  # SPA fallback.
  location / {
    add_header Cache-Control "no-store, must-revalidate";
    expires off;
    try_files $uri $uri/ /index.html;
  }

  # REST + MCP both live under the backend service.
  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /mcp {
    proxy_pass http://backend:8080/mcp;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Enable streaming for SSE (Spring AI MCP server uses SSE for tool events).
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    chunked_transfer_encoding off;
  }
}

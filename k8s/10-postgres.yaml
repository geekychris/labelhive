# Postgres credentials come from the Secret labelhive-db (username, password),
# created by hand (see 05-config.yaml); no password is kept in git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: labelhive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - {name: POSTGRES_DB, value: datalabel}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: labelhive-db, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: labelhive-db, key: password}}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d datalabel']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: labelhive
spec:
  # Internal-only — only the backend talks to Postgres.
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP

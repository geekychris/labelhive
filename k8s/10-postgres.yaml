apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: labelhive
type: Opaque
stringData:
  POSTGRES_DB: datalabel
  POSTGRES_USER: datalabel
  POSTGRES_PASSWORD: datalabel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: labelhive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: postgres-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "datalabel"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: labelhive
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      # devportal-allocated NodePort (see runtime.ports[postgres] in devportal.yaml).
      # Replace with the value returned by `mcp__devportal__allocate_ports(scope=k8s-nodeport)`.
      nodePort: 30102
      protocol: TCP

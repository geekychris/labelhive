apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: labelhive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: labelhive/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_PROFILES_ACTIVE
              value: "debug"
            # devportal fixture — boot the demo seeder so a fresh cluster comes up
            # populated with users + 6 jobs covering every template type.
            - name: DATALABEL_DEMO_SEED_ON_STARTUP
              value: "true"
            - name: DATALABEL_DEBUG_AUTH
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: labelhive
spec:
  # Internal-only — the frontend nginx proxies /api and /mcp to this service.
  # Bypass via `kubectl port-forward svc/backend 8080:8080` if you need direct API access.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: labelhive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: labelhive/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: datalabel
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: labelhive-db, key: username}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: labelhive-db, key: password}}
            # OIDC sign-in against the site's login service (05-config.yaml).
            - name: SPRING_PROFILES_ACTIVE
              value: "deployed"
            - name: OIDC_ISSUER
              valueFrom: {configMapKeyRef: {name: labelhive-oidc, key: OIDC_ISSUER}}
            - name: OIDC_BACKCHANNEL_URL
              valueFrom: {configMapKeyRef: {name: labelhive-oidc, key: OIDC_BACKCHANNEL_URL}}
            - name: OIDC_CLIENT_ID
              valueFrom: {configMapKeyRef: {name: labelhive-oidc, key: OIDC_CLIENT_ID}}
            - name: OIDC_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: labelhive-oidc, key: client-secret}}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: labelhive
spec:
  # Internal-only — the frontend nginx proxies /api and /mcp to this service.
  # Bypass via `kubectl port-forward svc/backend 8080:8080` if you need direct API access.
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

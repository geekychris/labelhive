[project]
name = "labelhive"
version = "0.1.0"
description = "Python client for LabelHive — crowd labeling, golden truth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labelhive"]

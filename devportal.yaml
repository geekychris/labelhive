apiVersion: devportal.io/v1
kind: Asset
metadata:
  id: labelhive
  name: LabelHive
  description: |
    Crowd-labeling platform inspired by CrowdFlower / Figure Eight. Spring Boot
    backend + React frontend, with both REST and MCP interfaces. Templates
    cover multi-choice through span annotation; supports gold mixing,
    cadence + fixed/escalating consensus, worker trust scoring, exemplar
    units for instructions, and dataset validation.
  owner: geekychris
  tags:
    - labeling
    - spring-boot
    - react
    - postgres
    - mcp
    - sdk
spec:
  type: service
  language: java
  build:
    tool: maven
    commands:
      install: cd backend && mvn -DskipTests install
      test: cd backend && mvn test
      build: cd backend && mvn -DskipTests package
      package: cd backend && mvn -DskipTests package
      clean: cd backend && mvn clean
  docker:
    enabled: true
    dockerfile: backend/Dockerfile
    context: backend
    image: labelhive/backend:latest
    images:
      - tag: labelhive/backend:latest
        dockerfile: backend/Dockerfile
        context: backend
      - tag: labelhive/frontend:latest
        dockerfile: frontend/Dockerfile
        context: frontend
  kubernetes:
    enabled: true
    manifestPath: k8s
    namespace: labelhive
  runtime:
    ports:
      - name: backend-http
        protocol: tcp
        purpose: http
      - name: frontend-http
        protocol: tcp
        purpose: http
      - name: postgres
        protocol: tcp
        purpose: db
    env:
      - name: DB_HOST
        default: postgres
        description: Hostname of the Postgres service.
      - name: DB_PORT
        default: "5432"
        description: Postgres in-cluster service port.
      - name: DB_NAME
        default: datalabel
        description: Postgres database / schema name.
      - name: DB_USER
        default: datalabel
        description: Postgres username.
      - name: DB_PASSWORD
        default: datalabel
        description: Postgres password (dev default — override in real environments).
      - name: SPRING_PROFILES_ACTIVE
        default: debug
        description: Activates the debug profile (relaxed auth + demo seeder on startup).
      - name: DATALABEL_DEBUG_AUTH
        default: "true"
        description: When true the backend resolves identity from X-User-Id (no real login).
      - name: DATALABEL_DEMO_SEED_ON_STARTUP
        default: "true"
        description: |
          When true, populates a fresh database with demo users + 6 jobs covering
          every template type — the demo-seed fixture (see docs/RUN.md).
  docs:
    architecture: docs/ARCHITECTURE.md
    build: docs/BUILD.md
    run: docs/RUN.md

apiVersion: devportal.io/v1
kind: Asset
metadata:
  id: labelhive
  name: LabelHive
  description: |
    Crowd-labeling platform inspired by CrowdFlower / Figure Eight. Spring Boot
    backend + React frontend, with both REST and MCP interfaces. Templates
    cover multi-choice through span annotation; supports gold mixing,
    cadence + fixed/escalating consensus, worker trust scoring, exemplar
    units for instructions, and dataset validation.
  owner: geekychris
  tags:
    - labeling
    - spring-boot
    - react
    - postgres
    - mcp
    - sdk
spec:
  type: service
  language: java
  build:
    tool: maven
    commands:
      install: cd backend && mvn -DskipTests install
      test: cd backend && mvn test
      build: cd backend && mvn -DskipTests package
      package: cd backend && mvn -DskipTests package
      clean: cd backend && mvn clean
      frontend-install: cd frontend && npm install
      frontend-test: cd frontend && npm test
      frontend-build: cd frontend && npm run build
      sdk-install: cd sdk/python && pip install -e .
  docker:
    enabled: true
    dockerfile: backend/Dockerfile
    context: backend
    image: labelhive/backend:latest
    images:
      - tag: labelhive/backend:latest
        dockerfile: backend/Dockerfile
        context: backend
      - tag: labelhive/frontend:latest
        dockerfile: frontend/Dockerfile
        context: frontend
  kubernetes:
    enabled: true
    manifestPath: k8s
    namespace: labelhive
  runtime:
    ports:
      - name: backend-http
        protocol: tcp
        purpose: http
        description: Spring Boot REST + MCP server (also serves /actuator and /mcp).
      - name: frontend-http
        protocol: tcp
        purpose: http
        description: nginx serving the built React UI; proxies /api to backend.
      - name: postgres
        protocol: tcp
        purpose: db
        description: Postgres 16 — units, judgments, jobs, trust.
    env:
      - name: DB_HOST
        default: postgres
        description: Hostname of the Postgres service.
      - name: DB_PORT
        default: "5432"
        description: Postgres in-cluster service port.
      - name: DB_NAME
        default: datalabel
        description: Postgres database / schema name.
      - name: DB_USER
        default: datalabel
        description: Postgres username.
      - name: DB_PASSWORD
        default: datalabel
        description: Postgres password (dev default — override in real environments).
      - name: SPRING_PROFILES_ACTIVE
        default: debug
        description: Activates the debug profile (relaxed auth + demo seeder on startup).
      - name: DATALABEL_DEBUG_AUTH
        default: "true"
        description: When true the backend resolves identity from X-User-Id (no real login).
      - name: DATALABEL_DEMO_SEED_ON_STARTUP
        default: "true"
        description: |
          When true, populates a fresh database with demo users + 6 jobs covering
          every template type. See the FIXTURES section below.
  fixtures:
    # The backend has a built-in demo seeder gated by datalabel.demo.seed-on-startup.
    # Flip this on for any environment that should boot up populated. The seeder is
    # idempotent — it no-ops if any jobs already exist.
    demo-seed:
      description: 6 demo jobs covering every built-in template type, plus 4 demo users.
      env:
        DATALABEL_DEMO_SEED_ON_STARTUP: "true"
      command: "(no-op — seeder runs on backend start when env is set)"
      seeds:
        users: ["demo (ADMIN)", "alice", "bob", "carol"]
        jobs:
          - "Search relevance — AI tooling queries (NDCG)"
          - "Is this image AI-generated?"
          - "Keyword span annotation"
          - "Sentiment on developer social posts"
          - "Content moderation"
          - "LLM answer factuality"
  docs:
    architecture: README.md
    build: README.md
    run: README.md
    sdk: sdk/python/README.md
    custom-types: docs/templates/CUSTOM_TYPE_TUTORIAL.md
